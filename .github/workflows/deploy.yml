name: Deploy Firebase Functions
on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install dependencies
        run: cd functions && npm install
      - name: Delete existing functions
        run: |
          firebase functions:delete generateHWPX --project creative-report-e38d7 --force || true
          firebase functions:delete generateWeeklyHWPX --project creative-report-e38d7 --force || true
          firebase functions:delete generateWeeklyAI --project creative-report-e38d7 --force || true
          firebase functions:delete generateWeeklyHWPX2 --project creative-report-e38d7 --force || true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Deploy to Firebase
        run: firebase deploy --only functions --project creative-report-e38d7 --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
